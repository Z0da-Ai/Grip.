<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="45%" stop-color="#1E1035" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Purple Glow Gradient -->
    <radialGradient id="purpleGlow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Glow Gradient -->
    <radialGradient id="emeraldGlow" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="500" fill="url(#bgGrad)" />
  <rect width="1024" height="500" fill="url(#purpleGlow)" />
  <rect width="1024" height="500" fill="url(#emeraldGlow)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1024" y2="100" />
    <line x1="0" y1="200" x2="1024" y2="200" />
    <line x1="0" y1="300" x2="1024" y2="300" />
    <line x1="0" y1="400" x2="1024" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="800" y1="0" x2="800" y2="500" />
  </g>

  <!-- Left Side: App Branding & Hero Text -->
  <g transform="translate(80, 80)">
    <!-- App Logo Icon -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="#2A2D34" stroke="#475569" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Chain Link Emblem matching user logo -->
    <g transform="translate(40, 40) scale(0.24) rotate(-45)">
      <path d="M -16 -62 L -68 -62 A 62 62 0 0 0 -68 62 L -16 62" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 16 62 L 68 62 A 62 62 0 0 0 68 -62 L 16 -62" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="-44" y1="0" x2="44" y2="0" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" />
    </g>

    <!-- App Category Tag -->
    <rect x="100" y="4" width="170" height="26" rx="13" fill="#6D28D9" fill-opacity="0.3" stroke="#8B5CF6" stroke-width="1" />
    <text x="185" y="21" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#DDD6FE" text-anchor="middle">تطبيق الإنتاجية الأول</text>

    <!-- App Title -->
    <text x="100" y="65" font-family="'Cairo', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">Grip • اقبض على تركيزك</text>

    <!-- Slogan / Subtitle -->
    <text x="0" y="130" font-family="'Cairo', sans-serif" font-size="20" font-weight="700" fill="#C4B5FD">Hold your focus. Kill the drift.</text>
    <text x="0" y="165" font-family="'Cairo', sans-serif" font-size="16" font-weight="500" fill="#94A3B8">تطبيق أندرويد متكامل لإدارة المهام والمذاكرة ونظام الإنفاذ الإلزامي بدون تشتت</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 210)">
      <!-- Pill 1: Wake up alarm -->
      <g>
        <rect x="0" y="0" width="140" height="36" rx="18" fill="#1E293B" stroke="#334155" />
        <circle cx="20" cy="18" r="6" fill="#F59E0B" />
        <text x="75" y="23" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">⏰ منبه الصحوة</text>
      </g>
      <!-- Pill 2: Voice AI -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="140" height="36" rx="18" fill="#1E293B" stroke="#334155" />
        <circle cx="20" cy="18" r="6" fill="#8B5CF6" />
        <text x="75" y="23" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">🎙️ مساعد صوتي</text>
      </g>
      <!-- Pill 3: Budget -->
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="140" height="36" rx="18" fill="#1E293B" stroke="#334155" />
        <circle cx="20" cy="18" r="6" fill="#10B981" />
        <text x="75" y="23" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">💰 إدارة المصروف</text>
      </g>
    </g>

    <!-- Trust Badges -->
    <g transform="translate(0, 280)">
      <text x="0" y="0" font-family="'Cairo', sans-serif" font-size="13" font-weight="600" fill="#64748B">✓ يعمل بدون إنترنت (Offline-First)   •   ✓ بدون إعلانات   •   ✓ خصوصية كاملة 100%</text>
    </g>
  </g>

  <!-- Right Side: Sleek Simulated UI Cards -->
  <g transform="translate(640, 60)" filter="url(#shadow)">
    <!-- Main Card 1: Task List -->
    <rect x="0" y="0" width="310" height="230" rx="24" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
    
    <!-- Card 1 Header -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="36" height="36" rx="10" fill="#6D28D9" fill-opacity="0.3" />
      <path d="M12 18 L16 22 L24 14" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="22" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">قائمة المهام اليومية</text>
      <text x="230" y="22" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" fill="#10B981">85% منجز</text>
    </g>

    <!-- Task Row 1 -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="270" height="42" rx="12" fill="#111827" stroke="#1F2937" />
      <circle cx="22" cy="21" r="9" fill="#10B981" />
      <path d="M18 21 L21 24 L26 18" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <text x="42" y="25" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">مذاكرة الجزء الأول فسيولوجي</text>
      <rect x="215" y="12" width="45" height="18" rx="6" fill="#3B82F6" fill-opacity="0.2" />
      <text x="237" y="25" font-family="'Cairo', sans-serif" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">مكتمل</text>
    </g>

    <!-- Task Row 2 -->
    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="270" height="42" rx="12" fill="#111827" stroke="#1F2937" />
      <circle cx="22" cy="21" r="9" stroke="#64748B" stroke-width="2" fill="none" />
      <text x="42" y="25" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">حل تمارين المراجعة العامة</text>
      <rect x="215" y="12" width="45" height="18" rx="6" fill="#F59E0B" fill-opacity="0.2" />
      <text x="237" y="25" font-family="'Cairo', sans-serif" font-size="10" font-weight="700" fill="#FCD34D" text-anchor="middle">قيد التنفيذ</text>
    </g>

    <!-- Progress Bar -->
    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="270" height="8" rx="4" fill="#374151" />
      <rect x="0" y="0" width="230" height="8" rx="4" fill="url(#accentGrad)" />
    </g>

    <!-- Floating Badge: Wake-Up Alarm -->
    <g transform="translate(-40, 205)" filter="url(#shadow)">
      <rect x="0" y="0" width="220" height="65" rx="18" fill="#18181B" stroke="#F59E0B" stroke-width="1.5" />
      <circle cx="32" cy="32" r="18" fill="#F59E0B" fill-opacity="0.2" />
      <text x="32" y="38" font-size="18" text-anchor="middle">⏰</text>
      <text x="62" y="28" font-family="'Cairo', sans-serif" font-size="12" font-weight="800" fill="#FDE68A">منبه الصحوة الحاسم</text>
      <text x="62" y="47" font-family="'Cairo', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">06:30 ص • No Snooze</text>
    </g>

    <!-- Floating Badge: Voice Expense -->
    <g transform="translate(130, 260)" filter="url(#shadow)">
      <rect x="0" y="0" width="200" height="60" rx="18" fill="#18181B" stroke="#10B981" stroke-width="1.5" />
      <circle cx="30" cy="30" r="16" fill="#10B981" fill-opacity="0.2" />
      <text x="30" y="36" font-size="16" text-anchor="middle">🎙️</text>
      <text x="56" y="26" font-family="'Cairo', sans-serif" font-size="11" font-weight="800" fill="#A7F3D0">تم قيد المصروف صوتياً</text>
      <text x="56" y="45" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">+50 ج.م قهوة ومشاريب</text>
    </g>
  </g>
</svg>
