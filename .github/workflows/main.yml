name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.GRIP_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: grip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode keystore
        if: github.ref == 'refs/heads/main' && env.KS_B64 != ''
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/grip-release.jks"

      - name: Release AAB
        if: github.ref == 'refs/heads/main' && env.KS_B64 != ''
        env:
          GRIP_KEYSTORE_PATH: ${{ runner.temp }}/grip-release.jks
          GRIP_KEYSTORE_PASSWORD: ${{ secrets.GRIP_KEYSTORE_PASSWORD }}
          GRIP_KEY_ALIAS: ${{ secrets.GRIP_KEY_ALIAS }}
          GRIP_KEY_PASSWORD: ${{ secrets.GRIP_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && env.KS_B64 != ''
        with:
          name: grip-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
