<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Grip</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;background:var(--ob-bg,#F8F9FA)}

/* ======================= ONBOARDING (full screen) ======================= */
:root{--ob-frame:#1F2433;--ob-bg:#F8F9FA;--ob-surface:#FFFFFF;--ob-border:#E5E7EB;--ob-text:#1F2433;--ob-muted:#6B7280;
 --ob-primary:#6D28D9;--ob-primary-press:#5B21B6;--ob-primary-text:#6D28D9;--ob-soft:#E9E3FB;
 --ob-g-bg:#FFFFFF;--ob-g-text:#1F1F1F;--ob-g-border:#747775}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ob-frame:#3A4056;--ob-bg:#0F1117;--ob-surface:#171A23;--ob-border:#2A2F3F;--ob-text:#ECEEF5;--ob-muted:#9AA1B5;
 --ob-primary:#7C3AED;--ob-primary-press:#6D28D9;--ob-primary-text:#A78BFA;--ob-soft:rgba(167,139,250,.16);
 --ob-g-bg:#131314;--ob-g-text:#E3E3E3;--ob-g-border:#8E918F}}
:root[data-theme="dark"]{--ob-frame:#3A4056;--ob-bg:#0F1117;--ob-surface:#171A23;--ob-border:#2A2F3F;--ob-text:#ECEEF5;--ob-muted:#9AA1B5;
 --ob-primary:#7C3AED;--ob-primary-press:#6D28D9;--ob-primary-text:#A78BFA;--ob-soft:rgba(167,139,250,.16);
 --ob-g-bg:#131314;--ob-g-text:#E3E3E3;--ob-g-border:#8E918F}
[hidden]{display:none!important}
.onb{position:fixed;inset:0;width:100%;height:100%;z-index:2147483000;isolation:isolate;display:flex;flex-direction:column;color:var(--ob-text);
 background:radial-gradient(circle at 50% 26%,var(--ob-soft) 0,transparent 62%),var(--ob-bg);   /* solid base: nothing from the page behind can show through */
 padding-top:env(safe-area-inset-top);opacity:0;transition:opacity .45s ease}
.onb.show{opacity:1}
.onb button{font-family:inherit}
.onb-top{display:flex;justify-content:space-between;align-items:center;min-height:58px;padding:10px 18px}
.onb-skip{background:none;border:0;color:var(--ob-muted);font-size:15px;font-weight:600;padding:9px 14px;border-radius:12px;cursor:pointer;transition:opacity .25s,color .2s}
.onb-skip:hover{color:var(--ob-text)}
.onb-skip.gone{opacity:0;pointer-events:none}
.onb button:focus-visible{outline:3px solid var(--ob-primary-text);outline-offset:3px}
.onb-vp{flex:1;min-height:0;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.onb-vp:active{cursor:grabbing}
.onb-track{display:flex;height:100%;will-change:transform}
.slide{height:100%;display:flex;align-items:center;justify-content:center;padding:0 24px;overflow:hidden}
.slide-in{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center}
.art{width:min(72vw,280px,30vh);aspect-ratio:1;margin-bottom:24px;overflow:visible}
.art.wide{width:min(80vw,280px);aspect-ratio:240/84;margin-bottom:18px}
.art svg{width:100%;height:100%;overflow:visible;display:block}
.slide h2{font-size:27px;line-height:1.3;margin:0 0 10px;font-weight:800}
.slide p{font-size:16px;line-height:1.75;color:var(--ob-muted);margin:0;max-width:320px}
.steps{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;width:100%}
.steps li{display:flex;align-items:center;gap:12px;background:var(--ob-surface);border:1px solid var(--ob-border);border-radius:16px;padding:11px 14px;text-align:start;font-size:15.5px;font-weight:600;line-height:1.5}
.steps small{display:block;font-weight:400;color:var(--ob-muted);font-size:13px}
.stepno{width:34px;height:34px;flex:none;border-radius:12px;background:var(--ob-soft);color:var(--ob-primary-text);display:grid;place-items:center;font-weight:800}
.icons{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:20px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--ob-surface);border:1px solid var(--ob-border);border-radius:18px;padding:16px 10px}
.tile svg{width:30px;height:30px;color:var(--ob-primary-text)}
.tile b{font-size:15px}.tile span{font-size:12.5px;color:var(--ob-muted);line-height:1.5}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.onb-bottom{padding:6px 24px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px}
.onb-hint{height:22px;font-size:13px;color:var(--ob-muted);display:flex;align-items:center;gap:8px;transition:opacity .35s}
.onb-hint.gone{opacity:0}
.chevs{display:inline-flex;color:var(--ob-primary-text)}
.chevs svg{width:14px;height:14px;animation:chev 1.2s ease-in-out infinite}
.chevs svg+svg{animation-delay:.18s;margin-inline-start:-6px}
[data-pager="ltr"] .chevs{transform:scaleX(-1)}
@keyframes chev{0%{opacity:.15;transform:translateX(-4px)}50%{opacity:1}100%{opacity:.15;transform:translateX(5px)}}
.dots{display:flex;gap:8px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--ob-border);transition:width .3s,background .3s}
.dot.on{width:26px;background:var(--ob-primary)}
.btn{width:100%;max-width:380px;height:54px;border-radius:16px;border:0;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ob-primary);color:#fff}
.btn-primary:active{background:var(--ob-primary-press)}
.btn-primary svg{width:20px;height:20px}
.btn-google{background:var(--ob-g-bg);color:var(--ob-g-text);border:1px solid var(--ob-g-border);font-weight:600;font-size:16px}
.btn-google svg{width:22px;height:22px}
.btn[disabled]{opacity:.65;cursor:default}
.legal{font-size:12px;color:var(--ob-muted);text-align:center;max-width:320px;line-height:1.6}
.err{font-size:13px;color:#F87171;min-height:18px}
/* gentle entrance of the visible slide */
@keyframes pop{from{opacity:.35;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:none}}
.slide.on .art{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.slide.on h2{animation:rise .5s .06s cubic-bezier(.2,.7,.2,1) both}
.slide.on p{animation:rise .5s .14s cubic-bezier(.2,.7,.2,1) both}
.slide.on .steps li,.slide.on .tile{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.slide.on li:nth-child(1),.slide.on .tile:nth-child(1){animation-delay:.12s}
.slide.on li:nth-child(2),.slide.on .tile:nth-child(2){animation-delay:.2s}
.slide.on li:nth-child(3),.slide.on .tile:nth-child(3){animation-delay:.28s}
.slide.on .tile:nth-child(4){animation-delay:.36s}
.float{animation:float 4.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.onb *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---- splash in dark mode ---- */
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--bg:#0F1117;--p:#A78BFA;--lav:rgba(167,139,250,.16);--ink:#ECEEF5;--mut:#9AA1B5;color-scheme:dark}
 :root:not([data-theme="light"]) .screen{background:radial-gradient(circle at 50% 40%,#2A1F4D 0,#0F1117 64%)}
 :root:not([data-theme="light"]) #gg stop:nth-child(1){stop-color:#A78BFA}
 :root:not([data-theme="light"]) #gg stop:nth-child(2){stop-color:#7C3AED}
 :root:not([data-theme="light"]) #pulse{stroke:#A78BFA}
}

/* language button, English (LTR) tweaks, settings picker */
.onb-lang{background:none;border:1px solid var(--ob-border);color:var(--ob-muted);font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer}
.onb-lang:hover{color:var(--ob-text)}
[dir="ltr"] .btn-primary svg{transform:scaleX(-1)}
html:not([data-i18n-ready]) body{visibility:hidden;animation:ob-reveal 0s 1.2s forwards}
@keyframes ob-reveal{to{visibility:visible}}
.lang-picker{display:flex;gap:4px;background:var(--ob-surface);border:1px solid var(--ob-border);border-radius:14px;padding:4px;width:100%;max-width:340px}
.lang-picker button{flex:1;border:0;background:none;color:var(--ob-muted);font:600 14px inherit;font-family:inherit;padding:11px 8px;border-radius:10px;cursor:pointer}
.lang-picker button.on{background:var(--ob-primary);color:#fff}
.app-stub{position:fixed;inset:0;z-index:30;background:var(--ob-bg);color:var(--ob-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center}
.app-stub h3{font-size:22px;margin:0}.app-stub .row{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.app-stub .row label{font-size:14px;color:var(--ob-muted);font-weight:600}

/* ---- animated "screen recording" demos inside a phone frame ---- */
.slide-in .phone{margin-top:16px}
.phone{height:min(40vh,320px);aspect-ratio:9/16;border-radius:30px;border:5px solid var(--ob-frame);background:var(--ob-surface);position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.16);flex:none}
.phone::before{content:"";position:absolute;top:6px;left:50%;width:32%;height:6px;border-radius:9px;background:var(--ob-frame);transform:translateX(-50%);z-index:2}
.ui{position:absolute;inset:0;padding:24px 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:11px;text-align:start}
.ui-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:2px}
.aitag{background:var(--ob-soft);color:var(--ob-primary-text);font-weight:800;font-size:9.5px;padding:2px 7px;border-radius:99px}
.ui-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ui-list li{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:11px;background:var(--ob-bg);border:1px solid var(--ob-border);font-weight:600;overflow:hidden;white-space:nowrap}
.ui-list li span{flex:1;overflow:hidden;text-overflow:ellipsis}
.ui-list li em{font-style:normal;color:var(--ob-muted);font-weight:500;font-size:10px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ob-primary-text);flex:none;transition:background .3s,border-color .3s}
/* demo 1: the new task slides into the list */
.ui-list li.new{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-top:-8px;border-width:0;transform:scale(.96);
 transition:max-height .55s cubic-bezier(.2,.8,.2,1),opacity .4s .12s,padding .55s,margin .55s,transform .55s,border-width .3s}
.s4 .ui-list li.new{max-height:44px;opacity:1;padding-top:8px;padding-bottom:8px;margin-top:0;border-width:1px;transform:none;background:var(--ob-soft);border-color:var(--ob-primary-text)}
.s4 .ui-list li.new .dot{background:var(--ob-primary);border-color:var(--ob-primary)}
.bubble{position:absolute;inset-inline:12px;bottom:58px;background:var(--ob-primary);color:#fff;border-radius:14px;padding:9px 11px;font-size:11px;font-weight:600;line-height:1.5;min-height:34px;
 opacity:0;transform:translateY(10px) scale(.97);transition:opacity .35s,transform .35s}
.bubble .aiset{display:flex;align-items:center;gap:4px;font-weight:600;font-size:10px;opacity:0;max-height:0;overflow:hidden;transition:opacity .3s,max-height .3s,margin .3s}
.bubble .aiset svg{width:11px;height:11px;stroke:#fff;fill:none}
.s2 .bubble{opacity:1;transform:none}
.s3 .bubble .aiset{opacity:.95;max-height:18px;margin-top:3px}
.s4 .bubble{opacity:0;transform:translateY(-8px)}
.bar{position:absolute;inset-inline:10px;bottom:10px;height:40px;border-radius:14px;border:1px solid var(--ob-border);background:var(--ob-bg);display:flex;align-items:center;gap:8px;padding-inline:12px}
.bar .ph{flex:1;color:var(--ob-muted);font-size:11px}
.wave{display:none;flex:1;align-items:center;gap:3px;height:22px}
.wave i{width:3px;height:8px;border-radius:2px;background:var(--ob-primary-text);animation:wv .7s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.15s}.wave i:nth-child(6){animation-delay:.25s}.wave i:nth-child(7){animation-delay:.05s}
@keyframes wv{50%{height:20px}}
.s1 .wave,.s2 .wave{display:flex}.s1 .bar .ph,.s2 .bar .ph{display:none}
.mic{width:28px;height:28px;border-radius:50%;background:var(--ob-primary);display:grid;place-items:center;color:#fff;position:relative;flex:none}
.mic svg{width:15px;height:15px}
.s1 .mic::after,.s2 .mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--ob-primary-text);animation:micp 1s ease-out infinite}
@keyframes micp{to{transform:scale(1.9);opacity:0}}
/* demo 2: a file becomes a plan */
.file{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:var(--ob-bg);border:1px solid var(--ob-border);font-weight:600;opacity:0;transform:translateY(-26px);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1)}
.file svg{width:18px;height:18px;color:var(--ob-primary-text)}
.s1 .file,.s2 .file,.s3 .file{opacity:1;transform:none}
.prog{height:5px;border-radius:5px;background:var(--ob-border);overflow:hidden;opacity:0;transition:opacity .3s}
.prog i{display:block;height:100%;width:0;background:var(--ob-primary)}
.rd{font-size:10.5px;color:var(--ob-muted);opacity:0;transition:opacity .3s;min-height:14px}
.s2 .prog,.s2 .rd{opacity:1}.s2 .prog i{width:100%;transition:width 1.4s ease}
.s3 .prog,.s3 .rd{opacity:0}.s3 .prog i{width:100%}
.ev{opacity:0;transform:translateY(10px) scale(.97);transition:opacity .4s,transform .45s cubic-bezier(.2,.8,.2,1)}
.s3 .ev{opacity:1;transform:none}
.s3 .ev:nth-child(2){transition-delay:.22s}.s3 .ev:nth-child(3){transition-delay:.44s}
.day{background:var(--ob-soft);color:var(--ob-primary-text);padding:3px 7px;border-radius:8px;font-size:10px;font-weight:700;flex:none}

.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px}
.file{overflow:hidden}
.prog{max-height:5px;transition:opacity .3s,max-height .4s,margin .4s}
.rd{max-height:16px;transition:opacity .3s,max-height .4s,margin .4s}
.s3 .prog,.s3 .rd{max-height:0;margin-top:-8px}
.s3 .rd{min-height:0}
</style>
<script>

   - The user can override it any time from Settings:  GripI18n.setLang('ar' | 'en' | 'auto')
   - Drop a ready-made language selector into your Settings screen:  GripI18n.mountPicker(element)
   - Add a language: add a block to D, and its code to SUPPORTED.                              */
(function(){
var D={
ar:{
 tagline:'مشتّت؟ استعد سيطرتك.',
 logoAria:'سلسلتان معلّقتان تتدلّيان ثم تنفتحان، وحرف G يمرّ داخل حلقتيهما ويلفّ ثم يستقر',
 onbAria:'مقدمة عن التطبيق', pages:'الصفحات',
 skip:'تخطي', switchTo:'English', next:'التالي', hint:'اسحب للمتابعة',
 s1Title:'مشتّت؟ استعد سيطرتك.',

 s4Title:'جاهز تستعيد سيطرتك؟', s4Text:'سجّل دخولك وكمّل على أي جهاز.',
 dHead:'النهاردة', r1:'التشريح', t1:'10 ص', r2:'تقرير المعمل', t2:'2 م',
 rn:'مراجعة الفارما', tn:'5 م', r3:'مشي', t3:'6 م',
 addPh:'ضيف مهمة…', voiceText:'راجع الفارما الساعة 5 العصر', aiSet:'الذكاء الاصطناعي ظبط الميعاد',
 d2Head:'الخطة', reading:'الذكاء الاصطناعي بيقرا الملف…',
 e1d:'الاتنين', e1:'الفصل الأول', e2d:'الأربع', e2:'تحضير للكويز', e3d:'الجمعة', e3:'مراجعة',
 google:'ابدأ الآن', signingIn:'جارٍ تسجيل الدخول…', googleFail:'حصل خطأ، حاول مرة تانية',
 legal:'بالمتابعة أنت بتوافق على شروط الاستخدام وسياسة الخصوصية.',

 langAuto:'تلقائي', langAutoHint:'حسب لغة الجهاز'
},
en:{
 tagline:'Too distracted? Get a Grip.',
 logoAria:'Two chains dangle, one link breaks, and a G threads through their rings and settles upright',
 onbAria:'App introduction', pages:'Pages',
 skip:'Skip', switchTo:'العربية', next:'Next', hint:'Swipe to continue',
 s1Title:'Too distracted? Get a Grip.',
 s1Text:'A productivity app built for ADHD brains,<br>made to actually work.',
 s2Title:'Schedule tasks fast<br>with AI and voice',

 s4Title:'Ready to get a grip?', s4Text:'Sign in and continue on any device.',

 rn:'Revise pharma', tn:'5 PM', r3:'Walk', t3:'6 PM',
 addPh:'Add a task…', voiceText:'Revise pharmacology at 5 PM', aiSet:'AI set the time',
 d2Head:'Plan', reading:'AI is reading your file…',

 google:'Get started', signingIn:'Signing in…', googleFail:"Something went wrong, please try again",

 appStarts:'The app starts here', settings:'Settings', langLabel:'Language',
 langAuto:'Automatic', langAutoHint:'Follows your device'
}};
var KEY='grip_lang', SUPPORTED=['ar','en'];
function pref(){try{var s=localStorage.getItem(KEY);return SUPPORTED.indexOf(s)>-1?s:'auto'}catch(e){return 'auto'}}

  var q=function(s){return [].slice.call(document.querySelectorAll(s))};
  q('[data-i18n]').forEach(function(e){e.textContent=I.t(e.getAttribute('data-i18n'))});
  q('[data-i18n-html]').forEach(function(e){e.innerHTML=I.t(e.getAttribute('data-i18n-html'))});
  q('[data-i18n-aria]').forEach(function(e){e.setAttribute('aria-label',I.t(e.getAttribute('data-i18n-aria')))});

  try{if(v==='ar'||v==='en')localStorage.setItem(KEY,v);else localStorage.removeItem(KEY)}catch(e){}

<body>

<!-- ======================= ONBOARDING ======================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <defs>
  <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#5B21B6"/></linearGradient>
  <linearGradient id="obm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8BFD6"/><stop offset="1" stop-color="#8C93B0"/></linearGradient>
  <!-- the Grip logo: two chains holding the G -->
  <symbol id="obLogo" viewBox="0 0 240 240" overflow="visible">

   <g transform="translate(120 120) scale(1.5) translate(-150 -150)">

 </defs>

   <span id="onbGoogleLabel" data-i18n="google"></span></button>

<script>
/* ======================= ONBOARDING LOGIC =======================
   Starts by itself when the splash finishes ("grip:splash-done").
   Events you can listen to:
     grip:google-signin     -> connect your real Google sign-in here (see the comment below)
     grip:onboarding-done   -> the user finished; open the app
   Settings:                                                                         */
(function(){
var SHOW_ONLY_FIRST_TIME=false;  // set to true in production so returning users skip it
var SEEN_KEY='grip_onboarding_seen';

var $=function(i){return document.getElementById(i)};
var root=$('onb'), vp=$('onbVp'), track=$('onbTrack'), slides=[].slice.call(track.children), n=slides.length,
    dotsEl=$('onbDots'), nextB=$('onbNext'), gB=$('onbGoogle'), skipB=$('onbSkip'), hint=$('onbHint'),
    err=$('onbErr'), legal=$('onbLegal'), gLabel=$('onbGoogleLabel');
var idx=0, vw=0, sg=1, RTL_PAGER=true, interacted=false, drag=null, nudgeAnim=null, started=false;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

var I=window.GripI18n, tr=function(k){return I.t(k)};
function layout(){                       // Arabic: first page on the right, swipe right = next.  English: mirrored.
  RTL_PAGER=I.dir==='rtl';sg=RTL_PAGER?1:-1;
  root.dataset.pager=RTL_PAGER?'rtl':'ltr';track.style.direction=RTL_PAGER?'rtl':'ltr';
}
layout();
track.style.width=(n*100)+'%';
slides.forEach(function(s){s.style.flex='0 0 '+(100/n)+'%'});
var dots=slides.map(function(_,i){var d=document.createElement('span');d.className='dot';d.setAttribute('role','tab');dotsEl.appendChild(d);return d});

function T(px){return 'translate3d('+(sg*px)+'px,0,0)'}
function setX(px,anim){track.style.transition=anim?'transform .45s cubic-bezier(.22,.8,.24,1)':'none';track.style.transform=T(px)}
function measure(){vw=vp.clientWidth}
function stopHint(){interacted=true;hint.classList.add('gone');if(nudgeAnim){nudgeAnim.cancel();nudgeAnim=null}}
/* the two animated demos: each one replays whenever its page is on screen */
var demos=[].slice.call(root.querySelectorAll('[data-demo]'));
var SEQ={voice:{steps:[[450,1],[1300,2],[3400,3],[4300,4]],period:8200},file:{steps:[[450,1],[1500,2],[3300,3]],period:7600}};
function setSteps(el,n){for(var i=1;i<=4;i++)el.classList.toggle('s'+i,i<=n)}
function stopDemo(el){(el._t||[]).forEach(clearTimeout);el._t=[];clearInterval(el._ty);setSteps(el,0);var v=el.querySelector('.vtext');if(v)v.textContent=''}
function typeVoice(el){
  var v=el.querySelector('.vtext'),txt=I.t('voiceText'),k=0;if(!v)return;clearInterval(el._ty);v.textContent='';
  el._ty=setInterval(function(){k++;v.textContent=txt.slice(0,k);if(k>=txt.length)clearInterval(el._ty)},Math.max(30,Math.floor(1600/txt.length)));
}
function playDemo(el){
  stopDemo(el);var name=el.getAttribute('data-demo'),cfg=SEQ[name];
  if(reduce){setSteps(el,name==='voice'?4:3);return}               // reduced motion: show the finished state
  (function cycle(){
    setSteps(el,0);var v=el.querySelector('.vtext');if(v)v.textContent='';
    cfg.steps.forEach(function(st){el._t.push(setTimeout(function(){setSteps(el,st[1]);if(name==='voice'&&st[1]===2)typeVoice(el)},st[0]))});
    el._t.push(setTimeout(cycle,cfg.period));
  })();
}
function syncDemos(){demos.forEach(function(el){var s=el.closest('.slide');if(s&&s.classList.contains('on')){if(!el._on){el._on=true;playDemo(el)}}else if(el._on){el._on=false;stopDemo(el)}})}
function render(){
  dots.forEach(function(d,i){d.classList.toggle('on',i===idx);d.setAttribute('aria-selected',i===idx)});
  slides.forEach(function(s,i){s.classList.toggle('on',i===idx)});
  var last=idx===n-1;
  nextB.hidden=last; gB.hidden=!last; legal.hidden=!last; skipB.classList.toggle('gone',last);
  if(idx>0)hint.classList.add('gone');
  syncDemos();
}
function go(i,anim){idx=Math.max(0,Math.min(n-1,i));measure();setX(idx*vw,anim!==false);render()}

/* swipe */
vp.addEventListener('pointerdown',function(e){
  if(e.button!==undefined&&e.button!==0)return;
  drag={x:e.clientX,t:performance.now(),f:0};stopHint();measure();
  track.style.transition='none';try{vp.setPointerCapture(e.pointerId)}catch(_){}
});
vp.addEventListener('pointermove',function(e){
  if(!drag)return;
  var f=sg*(e.clientX-drag.x);drag.f=f;
  var off=idx*vw+f, max=(n-1)*vw;
  if(off<0)off=off*.35; else if(off>max)off=max+(off-max)*.35;      // gentle resistance at the ends
  setX(off,false);
});
function endDrag(){
  if(!drag)return;
  var f=drag.f, v=Math.abs(f)/Math.max(1,performance.now()-drag.t), step=0;
  if(Math.abs(f)>vw*.18||v>.45)step=f>0?1:-1;
  drag=null;go(idx+step,true);
}
vp.addEventListener('pointerup',endDrag);vp.addEventListener('pointercancel',endDrag);

nextB.addEventListener('click',function(){stopHint();go(idx+1)});
skipB.addEventListener('click',function(){stopHint();go(n-1)});
document.addEventListener('keydown',function(e){
  if(root.hidden)return;
  var fwd=RTL_PAGER?'ArrowLeft':'ArrowRight', back=RTL_PAGER?'ArrowRight':'ArrowLeft';
  if(e.key===fwd){stopHint();go(idx+1)}else if(e.key===back){stopHint();go(idx-1)}
});
window.addEventListener('resize',function(){if(!root.hidden)go(idx,false)});

/* a light "swipe me" nudge on the first page */
function nudge(){
  if(reduce||interacted||idx!==0||!track.animate)return;
  nudgeAnim=track.animate([{transform:T(0)},{transform:T(46)},{transform:T(0)}],{duration:1100,easing:'ease-in-out',iterations:2,delay:200});
}

/* finish + Google sign-in */
function finish(){
  try{localStorage.setItem(SEEN_KEY,'1')}catch(_){}
  demos.forEach(function(el){el._on=false;stopDemo(el)});
  root.classList.remove('show');
  setTimeout(function(){
    root.hidden=true;
    document.dispatchEvent(new CustomEvent('grip:onboarding-done'));
    if(typeof window.onGripOnboardingDone==='function')window.onGripOnboardingDone();
  },450);
}
var signing=false;
function resetG(msg){signing=false;gB.disabled=false;gLabel.textContent=tr('google');err.textContent=(msg===undefined?tr('googleFail'):msg)}
gB.addEventListener('click',function(){
  err.textContent='';signing=true;gB.disabled=true;gLabel.textContent=tr('signingIn');
  /* >>> HOW TO CONNECT REAL GOOGLE SIGN-IN <<<
     In your app, add a listener (for example with Firebase Auth):
       document.addEventListener('grip:google-signin', function(e){
         e.preventDefault();                       // tells this screen: "I'm handling it"
         signInWithPopup(auth, new GoogleAuthProvider())
           .then(function(){ e.detail.success() })
           .catch(function(){ e.detail.fail() });
       });
     Without a listener this screen runs in DEMO mode: it just continues after ~1 second. */
  var ev=new CustomEvent('grip:google-signin',{cancelable:true,detail:{success:finish,fail:resetG}});
  document.dispatchEvent(ev);
  if(!ev.defaultPrevented){console.warn('[Grip] Google sign-in is not connected yet (demo mode).');setTimeout(finish,1000)}
});

/* start */
function start(){
  if(started)return;
  if(SHOW_ONLY_FIRST_TIME){var seen=false;try{seen=localStorage.getItem(SEEN_KEY)==='1'}catch(_){}
    if(seen){document.dispatchEvent(new CustomEvent('grip:onboarding-done'));if(typeof window.onGripOnboardingDone==='function')window.onGripOnboardingDone();return}}
  started=true;root.hidden=false;go(0,false);
  requestAnimationFrame(function(){requestAnimationFrame(function(){root.classList.add('show')})});
  setTimeout(nudge,1500);
}
$('onbLang').addEventListener('click',function(){stopHint();I.setLang(I.lang==='ar'?'en':'ar')});
document.addEventListener('grip:lang-changed',function(){layout();demos.forEach(function(el){if(el._on)playDemo(el)});if(signing)gLabel.textContent=tr('signingIn');if(!root.hidden)go(idx,false)});
I.apply();layout();
window.GripOnboarding={start:start,go:go};
if(!document.querySelector('.screen'))start();     // no splash on this page: start right away (otherwise it waits for grip:splash-done)
document.addEventListener('grip:splash-done',function(){
  var sp=document.querySelector('.screen');if(sp)sp.style.display='none';   // splash is finished, remove it
  start();
});
})();
</script>
</body>
